name: Krinry Flutter Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
      target_platform:
        description: 'Target platform'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          OUTPUT_TYPE="${{ github.event.inputs.output_type }}"
          TARGET_PLATFORM="${{ github.event.inputs.target_platform }}"

          if [ "$OUTPUT_TYPE" = "apk" ]; then
            if [ "$TARGET_PLATFORM" != "all" ]; then
              flutter build apk --$BUILD_TYPE --target-platform $TARGET_PLATFORM
            else
              flutter build apk --$BUILD_TYPE
            fi
          elif [ "$OUTPUT_TYPE" = "apk-split" ]; then
            flutter build apk --$BUILD_TYPE --split-per-abi
          elif [ "$OUTPUT_TYPE" = "appbundle" ]; then
            flutter build appbundle --$BUILD_TYPE
          fi

      - name: Find APK
        if: always()
        run: find build/ -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/**/*.aab
          if-no-files-found: warn
