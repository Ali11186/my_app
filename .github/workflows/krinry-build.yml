name: Krinry Flutter Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
      target_platform:
        description: 'Target platform'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      - name: Find and copy APK
        run: |
          mkdir -p output
          find . -name "*.apk" ! -path "*/sdk/*" ! -path "*/ndk/*" 2>/dev/null
          cp $(find . -name "*.apk" ! -path "*/sdk/*" ! -path "*/ndk/*" 2>/dev/null | head -1) output/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: output/app-release.apk
